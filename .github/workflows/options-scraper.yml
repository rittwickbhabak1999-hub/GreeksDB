name: NSE Options Chain Scraper

on:
  workflow_dispatch: # Allows manual execution from the UI
  schedule:
    - cron: '*/15 3-9 * * 1-5'


jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    
    # We set a permission to allow GitHub Actions to commit files back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        run: python scraper.py # Replace scraper.py with your actual python filename

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          # Only commit if there are actually changes in the data folder
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update options data at $(date -u) UTC"
          git push
