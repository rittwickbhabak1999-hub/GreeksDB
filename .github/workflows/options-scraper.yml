name: NSE Options Chain Scraper

on:
  workflow_dispatch: # Allows you to trigger the run manually from the GitHub UI
  schedule:
    # GitHub Cron uses UTC. IST is UTC+5:30. Runs Mon-Fri (1-5).
    
    # 1. Market Open Snapshot
    # Run at 09:15 AM IST (03:45 AM UTC) -> [1 Run]
    - cron: '45 3 * * 1-5'
    
    # 2. Hourly Trend Snapshots
    # Runs at 10:00 AM, 11:00 AM, 12:00 PM, 01:00 PM, 02:00 PM, and 03:00 PM IST
    # (Translates to 04:30, 05:30, 06:30, 07:30, 08:30, 09:30 UTC) -> [6 Runs]
    - cron: '30 4-9 * * 1-5'
    
    # 3. Late Afternoon Volume Surge
    # Run at 02:30 PM IST (09:00 AM UTC) -> [1 Run]
    - cron: '0 9 * * 1-5'
    
    # 4. Final Market Close Settlement Snapshot
    # Run at 03:30 PM IST (10:00 AM UTC) -> [1 Run]
    - cron: '0 10 * * 1-5'

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    
    # We set a permission to allow GitHub Actions to commit files back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        run: python scraper.py # Replace scraper.py with your actual python filename

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          # Only commit if there are actually changes in the data folder
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update options data at $(date -u) UTC"
          git push
